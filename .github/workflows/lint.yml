name: CI
on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          manifest-path: pyproject.toml
      - name: Run Ruff
        run: pixi run ruff
      - name: Run Ruff format
        run: pixi run ruff-format
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          manifest-path: pyproject.toml
      - name: Run mypy
        run: pixi run mypy
  typos:
    name: Spell Check with Codespell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v6
      - name: Check spelling
        uses: codespell-project/actions-codespell@master
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          manifest-path: pyproject.toml
      - name: Build and check packages
        run: pixi run check-build
